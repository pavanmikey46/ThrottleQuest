<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue and Black Login Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #000000; /* Set background color to black */
        }

        .container {
            width: 100%;
            height: 100vh; /* Set height to full viewport height */
            position: absolute; /* Position it absolutely to cover the body */
            top: 0;
            left: 0;
            background-color: #000000;
            border-radius: 0.5em;
            overflow: hidden;
            box-shadow: 0 0.3em 0.6em rgba(0, 0, 0, 0.2);
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    135deg,
                    transparent 0%,
                    transparent 47%,
                    #161616 47%,
                    #2c2c2c 53%,
                    transparent 53%,
                    transparent 100%
                ) 0 0/2em 2em,
                linear-gradient(
                    45deg,
                    #434343 0%,
                    #0a0a0a 47%,
                    transparent 47%,
                    transparent 53%,
                    #434343 53%,
                    #0a0a0a 100%
                ) 0 0/2em 2em,
                linear-gradient(
                    -45deg,
                    #434343 0%,
                    #434343 47%,
                    transparent 47%,
                    transparent 53%,
                    #434343 53%,
                    #434343 100%
                ) 0 0/2em 2em,
                linear-gradient(
                    45deg,
                    transparent 0%,
                    transparent 47%,
                    #000000 47%,
                    #434343 53%,
                    transparent 53%,
                    transparent 100%
                ) 1em 1em/2em 2em;
            opacity: 0.5;
            animation: patternFloat 20s linear infinite; /* Add animation */
        }

        .container::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    circle at 25% 25%,
                    rgba(255, 255, 255, 0.11) 0.5em,
                    transparent 0.5em
                ) 0 0/4em 4em,
                radial-gradient(
                    circle at 75% 75%,
                    rgba(255, 255, 255, 0.1) 0.3em,
                    transparent 0.3em
                ) 0 0/4em 4em,
                radial-gradient(
                    circle at 75% 25%,
                    rgba(13, 35, 69, 0.1) 0.4em,
                    transparent 0.4em
                ) 2em 0/4em 4em,
                radial-gradient(
                    circle at 25% 75%,
                    rgba(0, 0, 0, 0.15) 0.2em,
                    transparent 0.2em
                ) 2em 2em/4em 4em;
        }

        @keyframes patternFloat {
            0% {
                background-position:
                    0 0,
                    0 0,
                    0 0,
                    1em 1em;
            }
            100% {
                background-position:
                    2em 2em,
                    2em 2em,
                    2em 2em,
                    3em 3em;
            }
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 50%; /* Keep it circular */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 300px;
            height: 300px; /* Set height to match width for a perfect circle */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1; /* Ensure it is above the graphic */
        }

        h2 {
            text-align: center;
            color: #333;
            margin: 0 0 20px 0; /* Add margin for spacing */
        }

        .form-group {
            margin-bottom: 15px;
            width: 80%; /* Make form fields narrower */
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #1e90ff; /* Change border color on focus */
            outline: none; /* Remove default outline */
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #1e90ff; /* Button color */
            color: white; /* Text color for the button */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px margin-top: 10px; /* Add margin for spacing */
            transition: background-color 0.3s; /* Smooth transition */
        }

        input[type="submit"]:hover {
            background-color: #000000; /* Change button color on hover */
            color: white; /* Keep text color white on hover */
        }

        .footer {
            text-align: center;
            margin-top: 10px;
            color: #333;
            position: absolute;
            bottom: 10px; /* Position footer at the bottom of the circle */
        }
    </style>
</head>
<body>
    <div class="container"></div> <!-- Background container -->
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <input type="submit" value="Login">
        </form>
        <div class="footer">
            <p>&copy; 2025 Bike Store</p> <!-- Year updated to 2025 -->
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent the default form submission
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Store username and password in local storage
            localStorage.setItem("username", username);
            localStorage.setItem("password", password);

            // Redirect to homepage.html
            window.location.href = "homepage.html";
        });
    </script>
</body>
</html>
