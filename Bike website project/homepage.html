<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Dream World of Bikes</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh; /* Set height to full viewport height */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #111111; /* Set background color to match container */
            background-image: linear-gradient(
                32deg,
                rgba(8, 8, 8, 0.74) 30px,
                transparent
            );
            background-size: 60px 60px;
            background-position: -5px -5px;
            color: white;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .button {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px; /* Add some space between buttons */
        }

        .button:hover {
            background-color: #ff6347;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }

            .button {
                padding: 10px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="greeting"></h1>
        <p>Welcome to the dream world of bikes!</p>
        <button id="viewBikesButton" class="button">See Available Bikes</button>
        <button id="bookingButton" class="button">Click Here for Booking</button>
    </div>

    <script>
        // Function to display greeting
        function displayGreeting() {
            const username = localStorage.getItem("username") || "Guest";
            const greetingElement = document.getElementById("greeting");
            greetingElement.textContent = `Welcome, ${username}!`;
        }

        // Function to navigate to the newload.html page
        function viewAvailableBikes() {
            window.location.href = "newload.html";
        }

        // Function to navigate to the booking.html page
        function goToBooking() {
            window.location.href = "booking.html";
        }

        // Event listeners for the buttons
        document.getElementById("viewBikesButton").addEventListener("click", viewAvailableBikes);
        document.getElementById("bookingButton").addEventListener("click", goToBooking);

        // Call the displayGreeting function when the page loads
        window.onload = displayGreeting;
    </script>

</body>
</html>
